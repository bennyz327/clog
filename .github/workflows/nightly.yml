name: Nightly

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nightly.yml"
      - "scripts/**"
      - "src/**"
      - "static/**"
      - "clog_cli.py"
      - "clog_cli.spec"
      - "clog_gui.py"
      - "clog.spec"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build CLI bundle
        run: python -m PyInstaller --noconfirm clog_cli.spec

      - name: Build GUI bundle
        run: python -m PyInstaller --noconfirm clog.spec

      - name: Package nightly archive
        id: package
        run: python scripts/package_release.py --channel nightly --platform "${{ matrix.platform }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

  publish:
    name: Publish nightly
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish rolling nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/github_release.py publish \
            --repo "${{ github.repository }}" \
            --tag nightly \
            --target "${{ github.sha }}" \
            --name Nightly \
            --assets-dir release-assets \
            --body "Rolling nightly build from main at commit ${{ github.sha }}." \
            --prerelease \
            --move-tag
